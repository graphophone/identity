[package]
name = "identity"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = "1.12.0"
aws-sdk-s3 = "1.146.1"
bcrypt = "0.19.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "macros", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["v4"] }
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tonic-prost-build = "0.14"
